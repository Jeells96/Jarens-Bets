name: DK Pull - Board Scheduled

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. Each app checks the FREE events list (0 quota) and
    # pulls a game's DK lines exactly once, 10-45 minutes before its start -
    # closest to gametime while leaving time to bet. Runs with no game
    # entering the window report "skipped" without touching the odds API.
    - cron: "5,35 * * * *"

concurrency:
  group: dk-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: DK pull (Premium + Gridline)
        run: node dk_pull.js
