name: Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "35 13 * * *"

permissions:
  contents: read
  actions: read          # so the stall check can see whether the jobs fired

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check every app's live record
        run: node health_check.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
